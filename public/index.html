<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TRAVIGO — AI Travel Planner</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 95%;
      max-width: 900px;
      background: #0b1220;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-weight: 600;
    }

    .subtitle {
      text-align: center;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #1e293b;
      color: #fff;
      outline: none;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover { opacity: 0.9; }

    .result {
      margin-top: 25px;
      background: #020617;
      padding: 20px;
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.6;
      max-height: 400px;
      overflow-y: auto;
    }

    .footer {
      margin-top: 15px;
      text-align: center;
      font-size: 12px;
      opacity: 0.6;
    }

    @media(max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🌍 TRAVIGO</h1>
    <div class="subtitle">AI-Powered Smart Travel Planner</div>

    <div class="grid">
      <input id="destination" placeholder="Destination (Paris, Tokyo...)" />
      <input id="budget" placeholder="Budget (USD)" type="number" />
      <input id="days" placeholder="Number of Days" type="number" />
      <input id="travelers" placeholder="Travelers" type="number" />
    </div>

    <button onclick="generate()">Generate AI Itinerary</button>

    <div id="result" class="result" style="display:none;"></div>

    <div class="footer">Powered by Gemini AI • TRAVIGO</div>
  </div>

<script>
async function generate() {
  const destination = document.getElementById("destination").value;
  const budget = document.getElementById("budget").value;
  const days = document.getElementById("days").value;
  const travelers = document.getElementById("travelers").value;

  const resultBox = document.getElementById("result");
  resultBox.style.display = "block";
  resultBox.innerHTML = "Generating AI itinerary... ✨";

  const res = await fetch("/api/generate-itinerary", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ destination, budget, days, travelers })
  });

  const data = await res.json();
  resultBox.innerText = data.itinerary || "Failed to generate itinerary.";
}
</script>
</body>
</html>
